<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traffic Analyzer</title>
<style>
  :root { --bg:#0f1218; --card:#181d27; --line:#262d3b; --text:#e4e8ef; --dim:#8b95a7; --accent:#4f9dff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--text); padding:20px; }
  h1 { font-size:20px; margin:0 0 16px; display:flex; align-items:center; gap:10px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#e5484d; }
  .dot.live { background:#30a46c; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card .label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .card .value { font-size:24px; margin-top:4px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } }
  h2 { font-size:14px; margin:0 0 10px; color:var(--dim); font-weight:600; }
  .bar-row { display:grid; grid-template-columns:150px 1fr 80px; gap:8px; align-items:center; margin:6px 0; font-size:13px; }
  .bar { background:var(--line); border-radius:4px; height:10px; overflow:hidden; }
  .bar > div { background:var(--accent); height:100%; }
  .num { text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--dim); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:320px; }
  td.r, th.r { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { background:var(--line); border-radius:4px; padding:2px 6px; font-size:12px; }
  .filter { margin-bottom:10px; }
  select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  .scroll { overflow-x:auto; }
    tr.flagged td { background:#3a1a1d; }
  .flag { background:#e5484d; color:#fff; border-radius:4px; padding:2px 6px; font-size:11px; margin-left:6px; }
  .rules { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .rules input { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  .rules button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; }
  .chip { background:var(--line); border-radius:12px; padding:3px 10px; font-size:12px; }
  .chip b { cursor:pointer; margin-left:6px; color:#e5484d; }
</style>
</head>
<body>
<h1><span id="dot" class="dot"></span> Traffic Analyzer <span id="status" style="font-size:13px;color:var(--dim)">connecting…</span></h1>

<div class="cards">
  <div class="card"><div class="label">Flows</div><div class="value" id="c-flows">0</div></div>
  <div class="card"><div class="label">Total traffic</div><div class="value" id="c-bytes">0 B</div></div>
  <div class="card"><div class="label">Queue</div><div class="value" id="c-queue">0</div></div>
  <div class="card"><div class="label">Dropped packets</div><div class="value" id="c-drop">0</div></div>
</div>

<div class="grid">
  <div class="card"><h2>Apps</h2><div id="apps"></div></div>
  <div class="card"><h2>Top domains</h2><div id="domains"></div></div>
</div>

<div class="card" style="margin-bottom:16px">
  <h2>Flag rules <span id="flagcount" style="color:#e5484d"></span></h2>
  <div class="rules">
    <select id="rtype"><option>domain</option><option>app</option><option>ip</option></select>
    <input id="rvalue" placeholder="e.g. doubleclick.net" size="28">
    <button onclick="addRule()">Add rule</button>
  </div>
  <div class="rules" id="rulelist"></div>
</div>

<div class="card">
  <h2>Live flows</h2>
  <div class="filter">App: <select id="filter"><option value="">All</option></select></div>
  <div class="scroll">
  <table>
    <thead><tr><th>App</th><th>Name</th><th>Server</th><th class="r">Up</th><th class="r">Down</th><th class="r">Pkts</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(n) {
  for (const u of ["B","KB","MB","GB"]) {
    if (n < 1024) return (u === "B" ? Math.round(n) : n.toFixed(1)) + " " + u;
    n /= 1024;
  }
  return n.toFixed(1) + " TB";
}

async function loadRules() {
  const rules = await (await fetch("/rules")).json();
  $("rulelist").innerHTML = rules.map(r =>
    `<span class="chip">${esc(r.type)}: ${esc(r.value)}<b onclick="delRule(${r.id})">✕</b></span>`
  ).join("") || '<span style="color:var(--dim);font-size:12px">No rules yet</span>';
}
async function addRule() {
  const value = $("rvalue").value.trim();
  if (!value) return;
  const res = await fetch("/rules", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({type: $("rtype").value, value})});
  if (!res.ok) { alert((await res.json()).detail); return; }
  $("rvalue").value = "";
  loadRules();
}
async function delRule(id) { await fetch("/rules/" + id, {method:"DELETE"}); loadRules(); }
loadRules();

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { $("dot").className = "dot live"; $("status").textContent = "live"; };
  ws.onclose = () => { $("dot").className = "dot"; $("status").textContent = "disconnected, retrying…"; setTimeout(connect, 2000); };
  ws.onmessage = e => render(JSON.parse(e.data));
}

function render({stats, flows}) {
  $("flagcount").textContent = stats.flagged_flows ? `(${stats.flagged_flows} flagged flows)` : "";
  $("c-flows").textContent = stats.total_flows;
  $("c-bytes").textContent = fmt(stats.total_bytes);
  $("c-queue").textContent = stats.queue;
  $("c-drop").textContent = stats.dropped;

  const maxApp = Math.max(1, ...stats.apps.map(a => a.bytes));
  $("apps").innerHTML = stats.apps.slice(0, 10).map(a =>
    `<div class="bar-row"><span>${esc(a.app)}</span>
     <div class="bar"><div style="width:${a.bytes / maxApp * 100}%"></div></div>
     <span class="num">${fmt(a.bytes)}</span></div>`).join("");

  const maxDom = Math.max(1, ...stats.top_domains.map(d => d.bytes));
  $("domains").innerHTML = stats.top_domains.map(d =>
    `<div class="bar-row"><span title="${esc(d.domain)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.domain)}</span>
     <div class="bar"><div style="width:${d.bytes / maxDom * 100}%"></div></div>
     <span class="num">${fmt(d.bytes)}</span></div>`).join("");

  // keep the dropdown in sync with the apps seen so far
  const sel = $("filter"), current = sel.value;
  const names = stats.apps.map(a => a.app);
  if (names.join() !== [...sel.options].slice(1).map(o => o.value).join()) {
    sel.innerHTML = '<option value="">All</option>' +
      names.map(n => `<option>${esc(n)}</option>`).join("");
    sel.value = current;
  }

  const want = sel.value;
  const shown = want ? flows.filter(f => f.app === want) : flows;
  $("rows").innerHTML = shown.slice(0, 40).map(f =>
    `<tr class="${f.flagged ? "flagged" : ""}"><td><span class="tag">${esc(f.app)}</span>${f.flagged ? `<span class="flag" title="${esc(f.matched_rule)}">FLAGGED</span>` : ""}</td>
     <td title="${esc(f.name)}">${esc(f.name || "-")}</td>
     <td>${esc(f.server)}</td>
     <td class="r">${fmt(f.bytes_sent)}</td><td class="r">${fmt(f.bytes_recv)}</td>
     <td class="r">${f.packets}</td></tr>`).join("");
}

connect();
</script>
</body>
</html>
